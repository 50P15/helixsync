# Builds linux/arm64 images of an upstream HelixSync release and publishes
# them to this account's GHCR (ghcr.io/<owner>/helixsync-{server,web}).
# Upstream only publishes linux/amd64. The source is checked out straight
# from GhaziAlibi/helixsync at the release tag, so this fork never needs
# syncing to build a new version.
#
# A scheduled run checks the newest upstream version tag and builds it only when
# this account's GHCR doesn't have that version yet. A manual run always
# builds. `latest` is only moved when the built version is the upstream
# latest release.
#
# Note: GitHub disables scheduled workflows after 60 days without activity in
# the repository; re-enable it from the Actions tab if that happens.
name: ARM64 images

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version tag to build (e.g. 1.0.23). Empty = newest tag."
        required: false
        default: ""

concurrency:
  group: arm64-images
  cancel-in-progress: false

permissions: {}

env:
  UPSTREAM: GhaziAlibi/helixsync
  REGISTRY: ghcr.io

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
      build: ${{ steps.v.outputs.build }}
      is_latest: ${{ steps.v.outputs.is_latest }}
    steps:
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          # Upstream tags every version (vX.Y.Z) but only creates a GitHub
          # release when the extension changes, so use the newest tag.
          latest=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$UPSTREAM/tags?per_page=100" \
            | jq -r '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          version="${INPUT_VERSION#v}"
          [ -n "$version" ] || version="$latest"
          for v in "$version" "$latest"; do
            if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version: $v" >&2
              exit 1
            fi
          done

          build=true
          if [ "$EVENT_NAME" = schedule ]; then
            echo "$GH_TOKEN" | docker login "$REGISTRY" -u "$ACTOR" --password-stdin >/dev/null
            build=false
            for c in server web; do
              if ! docker buildx imagetools inspect "$REGISTRY/$owner/helixsync-$c:$version" >/dev/null 2>&1; then
                build=true
              fi
            done
          fi

          if [ "$build" = true ]; then
            echo "Building $UPSTREAM v$version (upstream latest: v$latest)"
          else
            echo "v$version already published, nothing to do"
          fi
          {
            echo "version=$version"
            echo "owner=$owner"
            echo "build=$build"
            echo "is_latest=$([ "$version" = "$latest" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.UPSTREAM }}
          ref: v${{ needs.resolve.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.component }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/helixsync-${{ matrix.component }}:${{ needs.resolve.outputs.version }}
            ${{ needs.resolve.outputs.is_latest == 'true' && format('{0}/{1}/helixsync-{2}:latest', env.REGISTRY, needs.resolve.outputs.owner, matrix.component) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=v${{ needs.resolve.outputs.version }}
          cache-from: type=gha,scope=arm64-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.component }}
