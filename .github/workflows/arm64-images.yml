# Builds linux/arm64 images of an upstream HelixSync release and publishes
# them to this account's GHCR (ghcr.io/<owner>/helixsync-{server,web}).
# Upstream only publishes linux/amd64. The source is checked out straight
# from GhaziAlibi/helixsync at the release tag, so this fork never needs
# syncing to build a new version.
name: ARM64 images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream release to build (e.g. 1.0.21). Empty = latest release."
        required: false
        default: ""

permissions: {}

env:
  UPSTREAM: GhaziAlibi/helixsync
  REGISTRY: ghcr.io

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner: ${{ steps.v.outputs.owner }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${INPUT_VERSION#v}"
          if [ -z "$version" ]; then
            version=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$UPSTREAM/releases/latest" | jq -r '.tag_name')
            version="${version#v}"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "Building $UPSTREAM v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [server, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.UPSTREAM }}
          ref: v${{ needs.resolve.outputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./${{ matrix.component }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/helixsync-${{ matrix.component }}:${{ needs.resolve.outputs.version }}
            ${{ env.REGISTRY }}/${{ needs.resolve.outputs.owner }}/helixsync-${{ matrix.component }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=v${{ needs.resolve.outputs.version }}
          cache-from: type=gha,scope=arm64-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=arm64-${{ matrix.component }}
